personas:
  # Abgestimmt auf ministral-3:14b mit 16 GB VRAM (#78, 2026-11-08). Seit
  # 2026-11-15 ist gemma4:26b der Default; die Werte unten sind noch die des
  # 14B und werden in #99 auf Gemma nachgestimmt. Der 14B-Stand bleibt als
  # Ensemble examples/classic_ministral14b erhalten.
  #
  # repeat_penalty steht bewusst nicht mehr hier: Dann gilt der Ollama-Default
  # (1.1). Die früheren 1.15 stammten aus der 8B-Zeit; am 2026-11-08 machten
  # 1.15, der Default und 1.0 für PETER keinen messbaren Unterschied.
  #
  # num_ctx 16384: Das 14B liegt damit mit 10 GB komplett auf der GPU. Wer mit
  # 8 GB VRAM beim 8B bleibt, sollte hier 8192 eintragen; das 8B braucht bei
  # 16384 rund 7,5 GB.
  #
  # Temperaturen gegenüber dem 8B-Stand etwas gesenkt: Das 14B schmückt bei
  # gleicher Temperatur mehr aus.
  #
  # Optional je Persona: `model: "<ollama-name>"` — ein eigenes Modell nur fürs
  # Solo, also das Gespräch zu zweit (#85). Im Orchester (Ask-All, Fazit,
  # AI-Dialog) spielen alle weiter auf core.model_name. Ohne Eintrag gilt
  # überall core.model_name.
  - name: LEAH
    llm_options:
      temperature: 0.8
      num_ctx: 16384
    defaults:
      featured: true
  - name: DORIS
    llm_options:
      temperature: 0.5
      num_ctx: 16384
  - name: PETER
    llm_options:
      temperature: 0.1
      num_ctx: 16384
  - name: POPCORN
    llm_options:
      temperature: 1.0
      num_ctx: 16384
