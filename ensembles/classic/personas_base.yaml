personas:
  # Abgestimmt auf gemma4:26b mit 16 GB VRAM (#99, 2026-11-21), aufbauend
  # auf der 14B-Abstimmung (#78, 2026-11-08). Der 14B-Stand bleibt als
  # Ensemble examples/classic_ministral14b erhalten.
  #
  # LEAH wärmer als unter dem 14B (0.8 statt 0.55): Gemmas eigener Default
  # ist temperature 1.0, der von ministral-3 0.15. POPCORN mit 1.0 verlor die
  # Blindverkostung 0:3 und bleibt bei 0.7 — mehr Katze ist eine Frage des
  # Prompts, nicht der Temperatur (#99a).
  #
  # repeat_penalty steht bewusst nicht mehr hier: Dann gilt der Ollama-Default
  # (1.1). Die früheren 1.15 stammten aus der 8B-Zeit; am 2026-11-08 machten
  # 1.15, der Default und 1.0 für PETER keinen messbaren Unterschied.
  #
  # num_ctx 16384: Bei Gemma gegen 8192 gemessen (2026-11-21) — erstes
  # Zeichen, Durchsatz, Kaltstart und CPU/GPU-Anteil (21/79) gleich; 8192
  # spart nichts und kürzt nur lange Gespräche früher. Wer mit 8 GB VRAM beim
  # 8B bleibt, sollte hier 8192 eintragen; das 8B braucht bei 16384 rund 7,5 GB.
  #
  # Optional je Persona: `model: "<ollama-name>"` — ein eigenes Modell nur fürs
  # Solo, also das Gespräch zu zweit (#85). Im Orchester (Ask-All, Fazit,
  # AI-Dialog) spielen alle weiter auf core.model_name. Ohne Eintrag gilt
  # überall core.model_name.
  - name: LEAH
    llm_options:
      temperature: 0.8
      num_ctx: 16384
    defaults:
      featured: true
  - name: DORIS
    llm_options:
      temperature: 0.5
      num_ctx: 16384
  - name: PETER
    llm_options:
      temperature: 0.1
      num_ctx: 16384
  - name: POPCORN
    llm_options:
      temperature: 0.7
      num_ctx: 16384
