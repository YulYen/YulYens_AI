# Bewusst getragene Schwachstellen-Befunde (#61).
#
# Gelesen von `scripts/audit_deps.py`, das in der CI läuft. Der Sinn ist
# derselbe wie bei `known_gap` im Guard-Korpus: nicht „keine Befunde", sondern
# **genau diese**. Der Abgleich schlägt in beide Richtungen an —
#
#   * ein Befund, der hier fehlt, ist neu und macht den Job rot;
#   * ein Eintrag, den pip-audit nicht mehr meldet, ist erledigt und muss
#     raus — sonst wächst die Liste still zu und schützt irgendwann nichts
#     mehr.
#
# Ein Eintrag ist eine Entscheidung, kein Stummschalter. Wer einen ergänzt,
# schreibt dazu, warum der Befund getragen wird und was ihn auflöst.
#
# **Zurzeit leer, und das ist der Punkt.** Unter Gradio 5.50 standen hier 30
# Befunde (7× gradio, 18× pillow, 5× starlette) — alle nicht behebbar, weil
# Gradio selbst `pillow<12.0` und `starlette<1.0` deckelte. Mit dem Sprung auf
# 6.22 (#61a) sind sie sämtlich weg; auch PYSEC-2026-211, für das es unter
# 5.x überhaupt keine Fassung gab. Dass die Liste leer werden *musste*, hat
# der Abgleich selbst gemeldet: stehengebliebene Einträge sind rot.
#
# Stand: 2026-08-03, nach dem Sprung auf Gradio 6.22.

