# Bewusst getragene Schwachstellen-Befunde (#61).
#
# Gelesen von `scripts/audit_deps.py`, das in der CI läuft. Der Sinn ist
# derselbe wie bei `known_gap` im Guard-Korpus: nicht „keine Befunde", sondern
# **genau diese**. Der Abgleich schlägt in beide Richtungen an —
#
#   * ein Befund, der hier fehlt, ist neu und macht den Job rot;
#   * ein Eintrag, den pip-audit nicht mehr meldet, ist erledigt und muss
#     raus — sonst wächst die Liste still zu und schützt irgendwann nichts
#     mehr.
#
# Ein Eintrag ist eine Entscheidung, kein Stummschalter. Wer einen ergänzt,
# schreibt dazu, warum der Befund getragen wird und was ihn auflöst.
#
# Stand: 2026-08-02, nach dem Sprung auf Gradio 5.50.

groups:
  - package: gradio
    reason: >-
      Behoben erst in 6.6.0 bis 6.16.0; PYSEC-2026-211 hat überhaupt keine
      Fassung. 5.50.0 ist das Ende der 5er-Reihe, es gibt also nichts, wohin
      man innerhalb von 5.x ausweichen könnte. Der Sprung auf 6.x ist #61a und
      hängt an zwei echten Umbauten (Chatbot-Paarformat entfällt ersatzlos,
      `gr.Blocks(js=…)` wandert nach `launch()`).
    ids:
      - PYSEC-2026-211 # ohne Fassung, auch in 6.x
      - PYSEC-2026-63
      - PYSEC-2026-64
      - PYSEC-2026-65
      - PYSEC-2026-66
      - PYSEC-2026-2178
      - PYSEC-2026-2179

  - package: pillow
    reason: >-
      Behoben in 12.1.1 bis 12.3.0 — aber **Gradio 5.50 deckelt `pillow<12.0`**.
      Die Fassungen sind damit nicht erreichbar, solange wir auf 5.x stehen;
      ein eigener Pin würde die Auflösung nur unlösbar machen. Gradio 6.22
      erlaubt `pillow<13.0`, mit #61a fällt diese ganze Gruppe weg. pillow ist
      eine reine Transitiv-Abhängigkeit: das Projekt verarbeitet keine
      hochgeladenen Bilder, die Persona-Porträts sind mitgelieferte Dateien.
