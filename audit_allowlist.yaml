  - package: pillow
    reason: >-
      Behoben in 13.0.0 — doppelt unerreichbar: 13.0 verlangt **Python ≥ 3.11**,
      und **Gradio deckelt `pillow<13.0`** (6.22 wie 6.31). Ein eigener Pin
      machte die Auflösung nur unlösbar. pillow ist reine
      Transitiv-Abhängigkeit: die App öffnet damit nur die mitgelieferten
      Persona-Porträts, alle `gr.Image` sind Anzeige ohne Upload. Das gilt
      auch für den einzigen HIGH-Befund (GHSA-78g4, libopenjp2 über
      `Image.open`). Löst sich, sobald Gradio den Deckel hebt *und* die
      Untergrenze bei 3.11 liegt — wer ein Bild-Upload einbaut, muss diese
      Gruppe vorher neu bewerten.
