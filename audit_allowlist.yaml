# Bewusst getragene Schwachstellen-Befunde (#61).
#
# Gelesen von `scripts/audit_deps.py`, das in der CI läuft. Der Sinn ist
# derselbe wie bei `known_gap` im Guard-Korpus: nicht „keine Befunde", sondern
# **genau diese**. Der Abgleich schlägt in beide Richtungen an —
#
#   * ein Befund, der hier fehlt, ist neu und macht den Job rot;
#   * ein Eintrag, den pip-audit nicht mehr meldet, ist erledigt und muss
#     raus — sonst wächst die Liste still zu und schützt irgendwann nichts
#     mehr.
#
# Ein Eintrag ist eine Entscheidung, kein Stummschalter. Wer einen ergänzt,
# schreibt dazu, warum der Befund getragen wird und was ihn auflöst.
#
# **Zwischen 2026-08-03 und 2026-11-01 war die Liste leer.** Unter Gradio
# 5.50 standen hier 30 Befunde, alle an Gradios Deckeln `pillow<12.0` und
# `starlette<1.0`; der Sprung auf 6.22 (#61a) hat sie sämtlich aufgelöst.
#
# **Seit 2026-11-01 trägt sie wieder zwei Gruppen, und beide haben dieselbe
# Wurzel: Python 3.10 ist im Oktober 2026 EOL gegangen.** Die behobenen
# Fassungen von filelock (4.2.1) und pillow (13.0.0) verlangen Python ≥ 3.11
# und sind auf der versprochenen Untergrenze 3.10 — auf der dieser Job läuft —
# nicht installierbar. Bei pillow kommt Gradios Deckel `pillow<13.0` dazu, der
# auch in 6.31 (2026-10-28) noch steht.
#
# Stand: 2026-11-02, Gradio 6.22, Audit unter Python 3.10.

groups:
  - package: filelock
    reason: >-
      Behoben in 4.2.1 — aber 4.2.x verlangt **Python ≥ 3.11**; auf 3.10 endet
      filelock bei 4.1.0. Transitiv über huggingface_hub, das Projekt sperrt
      selbst keine Dateien damit. Alle Befunde betreffen `SoftFileLock`/
      Lockdateien in einem Verzeichnis, das ein *anderer lokaler Nutzer*
      beschreiben kann (CVSS AV:L) — auf einer Einzelplatz-Installation ohne
      fremde Konten nicht erreichbar. Löst sich mit dem Anheben der
      Python-Untergrenze auf 3.11.
