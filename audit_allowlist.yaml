# Bewusst getragene Schwachstellen-Befunde (#61).
#
# Gelesen von `scripts/audit_deps.py`, das in der CI läuft. Der Sinn ist
# derselbe wie bei `known_gap` im Guard-Korpus: nicht „keine Befunde", sondern
# **genau diese**. Der Abgleich schlägt in beide Richtungen an —
#
#   * ein Befund, der hier fehlt, ist neu und macht den Job rot;
#   * ein Eintrag, den pip-audit nicht mehr meldet, ist erledigt und muss
#     raus — sonst wächst die Liste still zu und schützt irgendwann nichts
#     mehr.
#
# Ein Eintrag ist eine Entscheidung, kein Stummschalter. Wer einen ergänzt,
# schreibt dazu, warum der Befund getragen wird und was ihn auflöst.
#
# **Zwischen 2026-08-03 und 2026-11-01 war die Liste leer.** Unter Gradio
# 5.50 standen hier 30 Befunde, alle an Gradios Deckeln `pillow<12.0` und
# `starlette<1.0`; der Sprung auf 6.22 (#61a) hat sie sämtlich aufgelöst.
#
# **Am 2026-11-01 kamen zwei Gruppen dazu, beide mit derselben Wurzel:
# Python 3.10 war im Oktober 2026 EOL gegangen.** Die Fixes für filelock
# (4.2.1) und pillow (13.0.0) verlangten ≥ 3.11 und waren auf der damaligen
# Untergrenze nicht installierbar. Mit #79 (Untergrenze 3.12) ist filelock
# erledigt — der Abgleich hat die 17 Einträge selbst als stehengeblieben
# gemeldet. pillow bleibt: dort deckelt zusätzlich Gradio (`pillow<13.0`,
# auch in 6.31).
#
# **2026-11-11: ein weiterer pillow-Befund (PYSEC-2026-4363), ohne dass sich
# hier etwas geändert hätte** — eine neu veröffentlichte Meldung, derselbe
# Deckel. Betroffen ist der TIFF-Encoder beim *Speichern* von Bildern mit
# fremdbestimmten Metadaten. Die App speichert keine Bilder und nimmt keine
# entgegen (der einzige Upload ist die Gesprächs-JSON); die Begründung der
# Gruppe trägt also auch ihn.
#
# Stand: 2026-11-11, Gradio 6.31, Audit unter Python 3.12.

groups:
  - package: pillow
    reason: >-
      Behoben in 13.0.0 — aber **Gradio deckelt `pillow<13.0`** (6.22 wie
      6.31). Ein eigener Pin machte die Auflösung nur unlösbar. pillow ist reine
      Transitiv-Abhängigkeit: die App öffnet damit nur die mitgelieferten
      Persona-Porträts, alle `gr.Image` sind Anzeige ohne Upload. Das gilt
      auch für den einzigen HIGH-Befund (GHSA-78g4, libopenjp2 über
      `Image.open`). Löst sich, sobald Gradio den Deckel hebt (die
      Python-Seite ist seit #79 erfüllt) — wer ein Bild-Upload einbaut, muss
      diese Gruppe vorher neu bewerten.
