[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
# Bewusst nur `.`: die Pakete unter `src/` werden top-level importiert, ruff
# sortiert sie deshalb wie Fremdpakete ein — so liegen die Importblöcke im
# ganzen Repo. `src = [".", "src"]` wäre die ehrlichere Klassifizierung
# (es ist unser Code), verlangt aber eine Umsortierung in rund fünfzig
# Dateien; das gehört in einen eigenen Umbau und nicht in einen
# Abhängigkeits-Sprung.
src = ["."]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ISC"]
ignore = ["E203", "E501"]

[tool.ruff.lint.per-file-ignores]
# Tests stub modules in sys.modules before importing the unit under test.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "ollama: marks tests that perform real Ollama calls",
    "browser: drives the running WebUI in a real browser (needs Playwright)",
]
filterwarnings = [
    "ignore:Importing 'parser\\.split_arg_string'.*:DeprecationWarning",
    "ignore:Please use `import python_multipart` instead.:PendingDeprecationWarning",
]

# Typprüfung (#52): Modul für Modul erweitert, nicht per Big Bang — ein
# dauerhaft gelber Job wäre wertlos. src/core war der Anfang; storage und auth
# kamen mit #54/#53 dazu und waren von Beginn an sauber.
[tool.mypy]
python_version = "3.10"
files = ["src"]
mypy_path = "src"
# Ohne das ist src/ui/webui_format.py auf zwei Wegen erreichbar
# (webui_format und ui.webui_format) — mypy bricht dann ab.
explicit_package_bases = true
# Der Rest des Projekts wird mitgelesen (Signaturen!), aber nicht gemeldet —
# sonst müsste man alles auf einmal aufräumen.
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true

# Bibliotheken ohne Typ-Stubs. Bewusst einzeln statt global, damit ein neuer
# Import nicht stillschweigend ungeprüft durchrutscht.
[[tool.mypy.overrides]]
module = [
    "gradio.*",
    "colorama.*",
    "spacy.*",
    "piper.*",
    "ollama.*",
    "faster_whisper.*",
    # Windows-stdlib. Auf dem Linux-Runner nicht vorhanden; unter
    # `mypy --platform win32` kommt es aus typeshed und wird echt geprüft.
    "winsound",
]
ignore_missing_imports = true

# --- Schichten als Vertrag (import-linter) -------------------------------------
# CLAUDE.md sagt seit langem in Prosa, was wohin gehört. Ein Import, der das
# verletzt, fällt aber niemandem auf — er funktioniert ja. Diese Verträge machen
# daraus einen roten Job, der den konkreten Pfad nennt.
#
# Bewusst `forbidden`-Verträge statt einer strengen Schichtung: die echten
# Aufwärts-Abhängigkeiten (die AppFactory *baut* die Oberflächen) sind damit
# benannte Ausnahmen mit Begründung, statt die Schichtung unmöglich zu machen.
#
# Gleich beim ersten Lauf hat der Linter zwei Importe gefunden, die ein `grep`
# über die Dateiköpfe nicht sieht: **verzögerte Importe innerhalb von
# Funktionen**. Genau dafür ist er da.
[tool.importlinter]
root_packages = [
    "core", "config", "security", "storage", "auth",
    "wiki", "rss", "tts", "stt", "ui", "api", "email_adapter", "evals",
]

[[tool.importlinter.contracts]]
name = "Der Guard haengt an nichts ausser der Config"
type = "forbidden"
source_modules = ["security"]
# Der Guard wird von Wiki, RSS, Streamer und API gerufen — er darf nichts davon
# kennen. Sonst entsteht ein Kreis, und schlimmer: eine Regel, die sich am
# Aufrufer orientiert, ist keine Regel mehr.
#
# `config` fehlt in der Liste bewusst: `_load_texts` holt die Meldungstexte per
# Lazy-Import, wenn der Aufrufer keine mitgibt. config ist selbst ein Blatt,
# also keine Schichtverletzung — aber es ist die einzige erlaubte Abhängigkeit,
# und deshalb steht sie hier statt in jemandes Kopf.
forbidden_modules = [
    "core", "storage", "auth", "wiki", "rss",
    "tts", "stt", "ui", "api", "email_adapter", "evals",
]

[[tool.importlinter.contracts]]
name = "Die Konfiguration kennt niemanden"
type = "forbidden"
source_modules = ["config"]
# config wird von allem gelesen. Importierte sie zurück, wäre jeder Start eine
# Frage der Import-Reihenfolge.
forbidden_modules = [
    "core", "security", "storage", "auth", "wiki", "rss",
    "tts", "stt", "ui", "api", "email_adapter", "evals",
]

[[tool.importlinter.contracts]]
name = "Oberflaechen liegen oben"
type = "forbidden"
source_modules = [
    "core", "config", "security", "storage", "auth",
    "wiki", "rss", "tts", "stt",
]
forbidden_modules = ["ui", "api", "email_adapter"]
# Die drei bewussten Ausnahmen: die AppFactory baut die Oberflächen und den
# One-Shot-Provider, das ist ihr Zweck. Sie stehen hier namentlich, damit eine
# *vierte* solche Abhängigkeit auffällt, statt sich stillschweigend
# anzuschließen.
ignore_imports = [
    "core.factory -> ui.terminal_ui",
    "core.factory -> ui.web_ui",
    "core.factory -> api.provider",
]

[[tool.importlinter.contracts]]
name = "Wiki weiss nichts von RSS"
type = "forbidden"
source_modules = ["wiki"]
# Zwei Kontextquellen, die sich nicht kennen sollen: sonst wandert die
# Guard-Regel der einen in die andere und gilt bald nur noch halb.
forbidden_modules = ["rss"]

[[tool.importlinter.contracts]]
name = "RSS weiss nichts vom Wiki"
type = "forbidden"
source_modules = ["rss"]
forbidden_modules = ["wiki"]
