[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
# Bewusst nur `.`: die Pakete unter `src/` werden top-level importiert, ruff
# sortiert sie deshalb wie Fremdpakete ein — so liegen die Importblöcke im
# ganzen Repo. `src = [".", "src"]` wäre die ehrlichere Klassifizierung
# (es ist unser Code), verlangt aber eine Umsortierung in rund fünfzig
# Dateien; das gehört in einen eigenen Umbau und nicht in einen
# Abhängigkeits-Sprung.
src = ["."]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ISC"]
ignore = ["E203", "E501"]

[tool.ruff.lint.per-file-ignores]
# Tests stub modules in sys.modules before importing the unit under test.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "ollama: marks tests that perform real Ollama calls",
    "browser: drives the running WebUI in a real browser (needs Playwright)",
]
filterwarnings = [
    "ignore:Importing 'parser\\.split_arg_string'.*:DeprecationWarning",
    "ignore:Please use `import python_multipart` instead.:PendingDeprecationWarning",
]

# Typprüfung (#52): Modul für Modul erweitert, nicht per Big Bang — ein
# dauerhaft gelber Job wäre wertlos. src/core war der Anfang; storage und auth
# kamen mit #54/#53 dazu und waren von Beginn an sauber.
[tool.mypy]
python_version = "3.10"
files = ["src"]
mypy_path = "src"
# Ohne das ist src/ui/webui_format.py auf zwei Wegen erreichbar
# (webui_format und ui.webui_format) — mypy bricht dann ab.
explicit_package_bases = true
# Der Rest des Projekts wird mitgelesen (Signaturen!), aber nicht gemeldet —
# sonst müsste man alles auf einmal aufräumen.
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true

# Bibliotheken ohne Typ-Stubs. Bewusst einzeln statt global, damit ein neuer
# Import nicht stillschweigend ungeprüft durchrutscht.
[[tool.mypy.overrides]]
module = [
    "gradio.*",
    "colorama.*",
    "spacy.*",
    "piper.*",
    "ollama.*",
    "faster_whisper.*",
    # Windows-stdlib. Auf dem Linux-Runner nicht vorhanden; unter
    # `mypy --platform win32` kommt es aus typeshed und wird echt geprüft.
    "winsound",
]
ignore_missing_imports = true
