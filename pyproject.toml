[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Installiert wird nur editierbar: `pip install -e .` — config.yaml, ensembles/,
# locales/ und static/ liegen neben src/, nicht im Paket (src/yulyen_ai/paths.py).
[project]
name = "yulyen-ai"
description = "Yul Yen's AI Orchestra — local multi-persona chat on Ollama"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dynamic = ["version", "dependencies"]

[tool.setuptools.dynamic]
# Eine Quelle je Wahrheit: die Zahl steht in src/yulyen_ai/version.py, die Pins
# samt Begründung in requirements.txt.
version = { attr = "yulyen_ai.version.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]
include = ["yulyen_ai*"]

# Das Lab importiert das Orchester als Bibliothek und prüft es mit mypy;
# ohne Marker sähe es dahinter nur `Any`.
[tool.setuptools.package-data]
yulyen_ai = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
# Nur `.`: ruff findet `yulyen_ai` unter `src/` nicht und sortiert es deshalb
# wie ein Fremdpaket ein — so liegen die Importblöcke im ganzen Repo.
# `src = ["src", "."]` wäre die ehrlichere Klassifizierung (es ist unser
# Code), sortiert aber jede Datei um; das gehört in einen eigenen Commit, nicht
# zwischen inhaltliche Änderungen.
src = ["."]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ISC"]
ignore = ["E203", "E501"]

[tool.ruff.lint.per-file-ignores]
# Tests stub modules in sys.modules before importing the unit under test.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "browser: drives the running WebUI in a real browser (needs Playwright)",
]
filterwarnings = [
    "ignore:Importing 'parser\\.split_arg_string'.*:DeprecationWarning",
    "ignore:Please use `import python_multipart` instead.:PendingDeprecationWarning",
]

# Typprüfung (#52): Modul für Modul erweitert, nicht per Big Bang — ein
# dauerhaft gelber Job wäre wertlos. src/yulyen_ai/core war der Anfang; storage und auth
# kamen mit #54/#53 dazu und waren von Beginn an sauber.
[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "src"
# Ohne das ist src/yulyen_ai/ui/webui_format.py auf zwei Wegen erreichbar
# (webui_format und ui.webui_format) — mypy bricht dann ab.
explicit_package_bases = true
# Der Rest des Projekts wird mitgelesen (Signaturen!), aber nicht gemeldet —
# sonst müsste man alles auf einmal aufräumen.
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true

# Bibliotheken ohne Typ-Stubs. Bewusst einzeln statt global, damit ein neuer
# Import nicht stillschweigend ungeprüft durchrutscht.
[[tool.mypy.overrides]]
module = [
    "gradio.*",
    "colorama.*",
    "spacy.*",
    "piper.*",
    "ollama.*",
    "faster_whisper.*",
    # Windows-stdlib. Auf dem Linux-Runner nicht vorhanden; unter
    # `mypy --platform win32` kommt es aus typeshed und wird echt geprüft.
    "winsound",
]
ignore_missing_imports = true

# --- Schichten als Vertrag (import-linter) -------------------------------------
# CLAUDE.md sagt seit langem in Prosa, was wohin gehört. Ein Import, der das
# verletzt, fällt aber niemandem auf — er funktioniert ja. Diese Verträge machen
# daraus einen roten Job, der den konkreten Pfad nennt.
#
# Bewusst `forbidden`-Verträge statt einer strengen Schichtung: die echten
# Aufwärts-Abhängigkeiten (die AppFactory *baut* die Oberflächen) sind damit
# benannte Ausnahmen mit Begründung, statt die Schichtung unmöglich zu machen.
#
# Gleich beim ersten Lauf hat der Linter zwei Importe gefunden, die ein `grep`
# über die Dateiköpfe nicht sieht: **verzögerte Importe innerhalb von
# Funktionen**. Genau dafür ist er da.
[tool.importlinter]
root_package = "yulyen_ai"

[[tool.importlinter.contracts]]
name = "Der Guard haengt an nichts ausser der Config"
type = "forbidden"
source_modules = ["yulyen_ai.security"]
# Der Guard wird von Wiki, RSS, Streamer und API gerufen — er darf nichts davon
# kennen. Sonst entsteht ein Kreis, und schlimmer: eine Regel, die sich am
# Aufrufer orientiert, ist keine Regel mehr.
#
# `config` fehlt in der Liste bewusst: `_load_texts` holt die Meldungstexte per
# Lazy-Import, wenn der Aufrufer keine mitgibt. config ist selbst ein Blatt,
# also keine Schichtverletzung — aber es ist die einzige erlaubte Abhängigkeit,
# und deshalb steht sie hier statt in jemandes Kopf.
forbidden_modules = [
    "yulyen_ai.core", "yulyen_ai.storage", "yulyen_ai.auth", "yulyen_ai.wiki", "yulyen_ai.rss",
    "yulyen_ai.tts", "yulyen_ai.stt", "yulyen_ai.ui", "yulyen_ai.api", "yulyen_ai.email_adapter", "yulyen_ai.mcp_adapter",
]

[[tool.importlinter.contracts]]
name = "Die Konfiguration kennt niemanden"
type = "forbidden"
source_modules = ["yulyen_ai.config"]
# config wird von allem gelesen. Importierte sie zurück, wäre jeder Start eine
# Frage der Import-Reihenfolge.
forbidden_modules = [
    "yulyen_ai.core", "yulyen_ai.security", "yulyen_ai.storage", "yulyen_ai.auth", "yulyen_ai.wiki", "yulyen_ai.rss",
    "yulyen_ai.tts", "yulyen_ai.stt", "yulyen_ai.ui", "yulyen_ai.api", "yulyen_ai.email_adapter", "yulyen_ai.mcp_adapter",
]

[[tool.importlinter.contracts]]
name = "Oberflaechen liegen oben"
type = "forbidden"
source_modules = [
    "yulyen_ai.core", "yulyen_ai.config", "yulyen_ai.security", "yulyen_ai.storage", "yulyen_ai.auth",
    "yulyen_ai.wiki", "yulyen_ai.rss", "yulyen_ai.tts", "yulyen_ai.stt",
]
forbidden_modules = ["yulyen_ai.ui", "yulyen_ai.api", "yulyen_ai.email_adapter", "yulyen_ai.mcp_adapter"]
# Die drei bewussten Ausnahmen: die AppFactory baut die Oberflächen und den
# One-Shot-Provider, das ist ihr Zweck. Sie stehen hier namentlich, damit eine
# *vierte* solche Abhängigkeit auffällt, statt sich stillschweigend
# anzuschließen.
ignore_imports = [
    "yulyen_ai.core.factory -> yulyen_ai.ui.terminal_ui",
    "yulyen_ai.core.factory -> yulyen_ai.ui.web_ui",
    "yulyen_ai.core.factory -> yulyen_ai.api.provider",
]

[[tool.importlinter.contracts]]
name = "Wiki weiss nichts von RSS"
type = "forbidden"
source_modules = ["yulyen_ai.wiki"]
# Zwei Kontextquellen, die sich nicht kennen sollen: sonst wandert die
# Guard-Regel der einen in die andere und gilt bald nur noch halb.
forbidden_modules = ["yulyen_ai.rss"]

[[tool.importlinter.contracts]]
name = "RSS weiss nichts vom Wiki"
type = "forbidden"
source_modules = ["yulyen_ai.rss"]
forbidden_modules = ["yulyen_ai.wiki"]
