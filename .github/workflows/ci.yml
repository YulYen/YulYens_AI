name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Format & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install tooling
        run: pip install -r requirements-dev.txt
      # 'python -m' erzwingt die gepinnten pip-Versionen (PATH-Shadowing-Falle,
      # siehe CLAUDE.md "Bekannte Falle: PATH-Shadowing")
      - name: Black (check only)
        run: python -m black --check .
      - name: Ruff
        run: python -m ruff check .

  audit:
    # Bekannte Schwachstellen in den gepinnten Abhängigkeiten (#61).
    #
    # Blockierend, aber nicht naiv: nacktes `pip-audit` stünde hier dauerhaft
    # rot, weil Gradio 5.50 `pillow<12.0` und `starlette<1.0` deckelt und die
    # Fassungen damit unerreichbar sind. Ein Job, der immer rot ist, wird
    # ignoriert — dann entwertet er die Farbe für alle anderen mit.
    #
    # `scripts/audit_deps.py` hält den Befundstand deshalb gegen
    # `audit_allowlist.yaml`: bewusst getragene Befunde sind grün, ein neuer
    # ist rot, und ein Eintrag, den pip-audit nicht mehr meldet, ebenfalls —
    # sonst wächst die Liste still zu. Dasselbe Muster wie `known_gap` im
    # Guard-Korpus.
    name: Abhängigkeiten prüfen (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit PyYAML
      - name: Audit
        run: python scripts/audit_deps.py

  types:
    # Typprüfung über das ganze `src` (#52). Blockierend — ein Job, der auch
    # gelb sein darf, wird ignoriert und ist damit wertlos. Konfiguration
    # (Pfade, follow_imports, Stub-Ausnahmen) steht in pyproject.toml.
    name: Typen (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install tooling
        run: pip install -r requirements-dev.txt
      # 'python -m' wie bei Black/Ruff (PATH-Shadowing-Falle, siehe CLAUDE.md)
      - name: mypy
        run: python -m mypy
      # Zweiter Lauf mit angenommener Windows-Plattform. mypy wertet
      # `if sys.platform == "win32"` **statisch** aus: auf dem Linux-Runner ist
      # der winsound-Zweig toter Code und wird nie geprüft — bei einem
      # Windows-primären Projekt genau die falsche Richtung. Der Lauf läuft
      # hier, nicht auf einem Windows-Runner: mypy braucht die Plattform nicht,
      # nur die Annahme.
      - name: mypy (als Windows)
        run: python -m mypy --platform win32

  test:
    # OS-Matrix (#45): Das Projekt läuft Windows-primär, die CI lief bisher nur
    # auf Linux — winsound- und Pfadprobleme wären hier nie aufgefallen.
    # fail-fast: false, damit ein Windows-Fehler das Linux-Ergebnis nicht
    # verschluckt (und umgekehrt).
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests
        # Deliberately includes the 'slow' marker (locally 'make test' skips it).
        # spaCy- and Ollama-dependent tests skip themselves when the
        # model or server is unavailable (see tests/conftest.py).
        run: pytest -q -m "not ollama and not browser" --cov=src --cov-report=term-missing --cov-report=json
      - name: Coverage in die Job-Summary schreiben
        # Statt eines externen Badge-Dienstes (bräuchte Account und Token): die
        # Zahl steht direkt im Run. Siehe Backlog #45.
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if [ -f coverage.json ]; then
            pct=$(python -c "import json;print(f\"{json.load(open('coverage.json'))['totals']['percent_covered']:.1f}\")")
            echo "### Coverage: ${pct}%" >> "$GITHUB_STEP_SUMMARY"
          fi

  test-with-spacy:
    # Eigener Job, damit ein Fehler klar zuzuordnen ist: hier laufen die
    # Keyword-/Wiki-Tests, die ohne installiertes Modell sauber übersprungen
    # werden. Das Modell ist ~570 MB, deshalb gecacht (#45).
    name: Tests mit spaCy-Modell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Passende Modellversion aus der installierten spaCy ableiten
        # Nicht hart pinnen: requirements.txt erlaubt spacy>=3.7,<4.0, und ein
        # Modell verlangt seinerseits genau die passende Minor-Linie
        # (de_core_news_lg 3.7.0 will spacy<3.8.0). Eine feste Version bricht
        # daher, sobald spaCy eine Minor weiterzieht.
        id: spacy-version
        run: |
          ver=$(python -c "import spacy; print('.'.join(spacy.__version__.split('.')[:2]))")
          echo "model=${ver}.0" >> "$GITHUB_OUTPUT"
          echo "spacy=${ver}" >> "$GITHUB_OUTPUT"
      - name: spaCy-Modelle aus dem Cache holen
        id: spacy-cache
        uses: actions/cache@v4
        with:
          # Key trägt die Modellversion: eine neue spaCy-Minor lädt neu, sonst nie.
          path: ~/spacy-models
          key: spacy-models-${{ steps.spacy-version.outputs.model }}
      - name: spaCy-Modelle herunterladen (nur bei Cache-Miss)
        if: steps.spacy-cache.outputs.cache-hit != 'true'
        env:
          MODEL_VERSION: ${{ steps.spacy-version.outputs.model }}
        run: |
          mkdir -p ~/spacy-models
          base=https://github.com/explosion/spacy-models/releases/download
          # lg für die Keyword-Tests, md für den einen Wiki-Test, der md verlangt.
          for name in de_core_news_lg de_core_news_md; do
            url="${base}/${name}-${MODEL_VERSION}/${name}-${MODEL_VERSION}-py3-none-any.whl"
            curl -fsSL -o "$HOME/spacy-models/${name}-${MODEL_VERSION}-py3-none-any.whl" "$url"
          done
      - name: spaCy-Modelle installieren
        # --no-deps ist der Punkt: die Wheels verlangen ihrerseits eine spaCy-
        # Version, die längst installiert ist. Ohne das Flag versucht pip sie
        # aufzulösen und scheitert.
        run: pip install --no-deps ~/spacy-models/*.whl
      - name: Modelle sind wirklich importierbar
        # Sonst würden die Tests einfach wieder skippen und der Job wäre grün,
        # ohne etwas geprüft zu haben.
        run: |
          python -c "import de_core_news_lg, de_core_news_md; print('Modelle da')"
      - name: Keyword- und Wiki-Tests
        # Gezielt die Tests, die das Modell brauchen — der Rest läuft im
        # test-Job und muss hier nicht doppelt laufen.
        run: pytest -q -m "not ollama and not browser" tests/test_spacy_keywords.py tests/test_wiki.py
