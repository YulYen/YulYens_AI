# Language: German (de) or English (en)
language: "de"

# --- Core settings ---------------------------------------------------------------
core:
  # Backend selection: use "ollama" for real LLMs, "dummy" for quick echo tests
  backend: "ollama"
  # Default model name at startup
  model_name: "ministral-3:8b" # e.g. "gptoss20b-q4ks", "mistral7b-local", or "leo-hessianai-13b-chat.Q5" or  "ministral-3:8b"
  # Preload the model in a background thread at startup so the first question
  # hits a warm model. The app starts fine even if Ollama is not running.
  warm_up: true
  # How long Ollama keeps the model in memory after a request (seconds).
  # -1 = keep loaded forever, 0 = unload immediately (Ollama semantics).
  keep_alive: 600
  # Base URL for Ollama (protocol + host + port), e.g. http://127.0.0.1:11434
  ollama_url: "http://127.0.0.1:11434"
  include_date: true  # master switch for the "three timestamps" prompt block
  # Training-knowledge cutoff per model (YYYY-MM). Used so personas don't claim
  # their knowledge reaches today. Models not listed here are described in the
  # prompt as "cutoff unknown".
  knowledge_cutoffs:
    # Source: Mistral's official SYSTEM_PROMPT.txt for Ministral-3 states a
    # knowledge cutoff of 2023-10 (same base data as Mistral Small 3.1/3.2).
    # Note: release tag is 2512 (Dec 2025) — release date != data cutoff.
    "ministral-3:8b": "2023-10"

# --- UI settings ---------------------------------------------------------------
ui:
  type: web   # options: "web", "terminal", or null (= API only)
  experimental:
    broadcast_mode: true  # enable the ensemble broadcast toggle (TerminalUI, WebUI)
    broadcast_parallel: true  # WebUI ask-all: stream all personas concurrently (needs OLLAMA_NUM_PARALLEL >= persona count for a real speedup)
  web:
    host: "0.0.0.0"
    port: 7860
    share: false  # enable to publish a public Gradio share link
    # Anmeldung (#53). Gilt unabhängig von `share` — die App horcht oben auf
    # 0.0.0.0, ist im LAN also ohne Login sonst offen.
    # ACHTUNG: Basic-Auth geht über HTTP im Klartext. Ohne TLS ist das eine
    # Trennung von Nutzern, kein Schutz gegen Mitlesen.
    auth:
      provider: "disabled"   # disabled | local | header
      # provider: local — Passwörter als env:NAME, nicht im Klartext hier:
      users: {}
      #  yulyen: "env:YULYEN_WEB_PASSWORD"
      # provider: header — Identität von einem vorgeschalteten Proxy
      # (oauth2-proxy, Authelia, …). Nur hinter einem Proxy benutzen, der den
      # Header von außen entfernt! Das ist der Weg zu Keycloak.
      header_name: "X-Forwarded-User"
    # Veraltet, wirkt nur noch als Fallback wenn `auth` fehlt:
    share_auth:
      username: ""
      password: ""


# --- Text-to-Speech settings (piper is currently the only provider) ---------------------------------------------------------------
tts:
  enabled: true
  features:
    terminal_auto_create_wav: true  # creates a wav-file in "out" directory for every AI-Answer
    web_read_aloud: true            # "Vorlesen"-Button in der Web-UI (braucht pip install piper-tts + Stimmen)
  voices:
    default:
      de: "de_DE-thorsten-high"
      en: "en_US-amy-medium"
    personas_de:
      DORIS: "de_DE-kerstin-low"
      POPCORN: "de_DE-pavoque-low"
      LEAH: "de_DE-kerstin-low"
      PETER: "de_DE-thorsten-high"

# --- Speech-to-Text settings (faster-whisper, optional: pip install faster-whisper) -----------------------------
stt:
  enabled: true            # Mikro in der Web-UI erscheint nur, wenn zusätzlich faster-whisper installiert ist
  model: "small"           # tiny | base | small | medium | large-v3
  device: "auto"           # auto | cpu | cuda
  compute_type: "auto"     # auto | int8 | float16 …
  language: "de"           # null = Auto-Erkennung

# --- Briefing (RSS): Persona fasst konfigurierte Feeds zusammen -------------------------------------------------
briefing:
  enabled: true            # Briefing-Button (WebUI) + /briefing (Terminal); Netz-Fetch nur auf Klick/Kommando
  max_items_per_feed: 4
  timeout_connect: 5.0
  timeout_read: 8.0
  feeds:
    - name: "tagesschau"
      url: "https://www.tagesschau.de/index~rss2.xml"
    - name: "heise online"
      url: "https://www.heise.de/rss/heise-atom.xml"

# --- Wiki settings (including spaCy-Keyword-Finder) -------------------------------------------------------------
wiki:
  # offline uses Kiwix, online calls Wikipedia, false disables wiki snippets
  mode: offline
  # spaCy model variant for keyword extraction: "medium" or "large"
  spacy_model_variant: "large"
  spacy_model_map:
    de:
      medium: "de_core_news_md"
      large:  "de_core_news_lg"
    en:
      medium: "en_core_web_md"
      large:  "en_core_web_lg"
  online_base_url_map:
    de: "https://de.wikipedia.org"
    en: "https://en.wikipedia.org"
  # Port of the local proxy (always required)
  proxy_port: 8042
  # Maximum wiki snippet length in characters (recommend 1200–1600)
  snippet_limit: 1200
  # Maximum number of distinct wiki snippets to inject when multiple entities are detected
  max_wiki_snippets: 2
  timeout_connect: 5.0
  timeout_read: 8.0
  offline:  # only relevant when mode == "offline" (Kiwix-based wiki mode)
    host: "127.0.0.1"  # preferred host for kiwix-serve; faster than localhost
    kiwix_port: 8080 #
    zim_prefix: "wikipedia_de_all_nopic_2026-01"
    autostart: true
    kiwix_exe: "C:/wikipedia-de-offline/kiwix-serve.exe"   # path to kiwix-serve (Windows example)
    zim_path: "C:\\wikipedia-de-offline\\wikipedia_de_all_nopic_2026-01.zim"
    startup_timeout_s: 7

# --- Logging -------------------------------------------------------------------
logging:
  level: "INFO"   # valid levels: DEBUG, INFO, WARNING, ERROR
  to_console: "auto" # "true", "false" or "auto" (auto: false if terminal-ui, otherwise true)
  dir: "logs"
  conversation_prefix: "conversation"
  # Roher JSONL-Mitschnitt pro Streamer. Seit #54 ist das ein Debug-Artefakt,
  # nicht die Ablage — die Gespräche liegen in storage.path.
  conversation_jsonl: false
  trace_prompts: false  # true: log the readable final prompt (incl. injected wiki snippets) per turn at INFO
  log_raw_chunks: false # true: log every raw token chunk at DEBUG (very noisy; needs level: DEBUG too)

# --- Gesprächs-Ablage (#54) ------------------------------------------------------
# Gespräche liegen in einer SQLite-Datei (stdlib, keine zusätzliche Abhängigkeit)
# statt in Logdateien. Das gibt jedem Gespräch eine ID, die auch einen
# Modellwechsel überlebt, und ist die Grundlage für Verlauf (#25) und Suche (#49).
storage:
  enabled: true
  path: "data/conversations.sqlite3"
  # Datei-Austausch mit der Außenwelt: JSON herunterladen/hochladen im WebUI,
  # /save und "Gespräch laden" im Terminal. Das ist etwas anderes als die
  # Ablage oben — wer es nicht braucht, schaltet es hier ab.
  # Nicht betroffen: der Markdown-Export im Verlauf, der gehört zum Verlauf.
  file_exchange: true
  # Wie viele Gespräche die Verlauf-Liste zeigt (neueste zuerst).
  history_limit: 50

# --- Persona e-mail adapter -----------------------------------------------------
# Optional IMAP/SMTP bridge: routes incoming plain-text e-mails to personas via
# the same one-shot provider used by the HTTP API. Keep secrets in environment
# variables (env:NAME or ${NAME}); never commit real mailbox credentials.
email_adapter:
  enabled: false
  poll_interval_seconds: 60
  address_persona_map:
    # lea@example.de: LEAH
    # peter@example.de: PETER
  imap:
    host: "imap.example.de"
    port: 993
    ssl: true
    username: "env:YULYEN_MAIL_IMAP_USER"
    password: "env:YULYEN_MAIL_IMAP_PASSWORD"
  smtp:
    host: "smtp.example.de"
    port: 465
    ssl: true
    starttls: false
    username: "env:YULYEN_MAIL_SMTP_USER"
    password: "env:YULYEN_MAIL_SMTP_PASSWORD"
    from_address: "env:YULYEN_MAIL_FROM"
  processing:
    source_mailbox: "INBOX"
    processed_mailbox: "INBOX/YulYenProcessed"
    processed_flag: "YulYenProcessed"
    search_criteria: "UNSEEN"

# --- One-shot API (e.g. for tests) ----------------------------------------------
api:
  enabled: true
  host: "127.0.0.1"
  port: 8013

  # OpenAI-kompatible Endpunkte (#37): /v1/models und /v1/chat/completions.
  # "model" ist der Persona-Name, nicht das LLM — /v1/models listet daher die
  # Personas. Damit sprechen Open WebUI, Handy-Apps und Editor-Plugins mit den
  # Personas, inklusive Guard, Wiki-Injection und Gesprächslog.
  openai_compatible:
    # Schaltet nur /v1 ab; /ask bleibt davon unberührt und hängt an api.enabled.
    enabled: true
    # Optionaler Bearer-Key. Leer = offen (nur sinnvoll, solange host auf
    # 127.0.0.1 steht!). Sobald der Server im LAN hängt: setzen, am besten als
    # "env:YULYEN_API_KEY" statt im Klartext.
    #
    # Er gilt für ALLE Endpunkte, auch für /ask — der Name sagt nur, wo die
    # Option steht. Vorher schützte er ausschließlich /v1, während /ask auf
    # demselben Port dieselbe Fähigkeit ohne Schlüssel anbot; wer ihn setzte,
    # hielt die API damit für abgesichert, ohne es zu sein.
    # /health bleibt bewusst frei, sonst meldet ein Monitor den Prozess als tot.
    api_key: ""
    # Fixed-Window-Limit pro Client und Minute; 0 schaltet es ab. Klein
    # angesetzt, weil ein einzelnes Ollama die Anfragen ohnehin serialisiert.
    # Gilt ebenfalls für /ask.
    rate_limit_per_minute: 60

security:
  enabled: true
  guard: BasicGuard
  prompt_injection_protection: true
  pii_protection: false
  output_blocklist: true
  wrongdoing_protection: true
  # After a wrongdoing hit, also block the next N inputs unconditionally
  # (catches "it's just for a novel" reframings). 0 = off: only the matching
  # request is refused, benign follow-ups pass again.
  wrongdoing_lock_turns: 0
  # Input: block wrongdoing (weapons/violence) + injections/PII.
  # Output: mask PII, block secrets.
  #
  # Wie viele Zeichen am Ende des Streams zurückgehalten werden, damit ein
  # PII-/Secret-Muster nicht über eine Token-Grenze hinweg durchrutscht.
  # ⚠️ Das ist DIE Stellschraube für die wahrgenommene Antwortzeit (#51): es
  # geht nichts an die Anzeige, bevor so viele Zeichen erzeugt sind. Im Browser
  # gemessen bei 24 Zeichen/s: 96 → ~4,1 s bis zum ersten Wort, 32 → ~1,9 s,
  # 0 → ~0,4 s.
  #
  # Default 32: guter Kompromiss für den typischen Fall — lokal, ein Nutzer,
  # niemand sonst liest mit. Deckt IBAN, AWS-Access-Key und Telefonnummern
  # vollständig ab.
  #
  # Auf 96 erhöhen, wenn eines davon zutrifft:
  #   - der Server ist für andere erreichbar (api.host ≠ 127.0.0.1,
  #     ui.web.host ≠ 127.0.0.1, Gradio-Share-Link, E-Mail-Adapter aktiv)
  #   - in den Gesprächen tauchen echte Zugangsdaten oder fremde
  #     personenbezogene Daten auf, die das Modell nachplappern könnte
  # Denn erst ab ~96 Zeichen liegen auch lange Muster (E-Mail-Adressen,
  # API-Keys) sicher innerhalb des Fensters, bevor der erste Teil sichtbar wird.
  #
  # 0 schaltet den Straddle-Schutz ab. Wirkt ohnehin nur, wenn pii_protection
  # oder output_blocklist an ist — sonst gibt es ausgangsseitig nichts zu prüfen
  # und es wird automatisch nichts zurückgehalten.
  stream_holdback_chars: 32

# --- Context management ---------------------------------------------------------
# strategy "heuristic" (default): quick token-based trimming of old messages.
# strategy "karl": LLM-based summary of older history (opt-in, needs Ollama).
context_management:
  strategy: "heuristic"  # allowed values: "heuristic" or "karl"

  karl:
    model: "same_as_chat"  # or explicit Ollama model name
    summary_max_tokens: 512
    keep_last_messages: 2
    log_dir: "logs"
    fallback_strategy: "heuristic"  # on summarization failure; omit to fail hard

# --- Eval suite (#41) -----------------------------------------------------------
# Only read by scripts/run_evals.py — the app itself ignores this section.
# Corpora live as YAML under evals/. See evals/ReadMe.md.
evals:
  out_dir: "logs/evals"
  # Judge model for the character ratings. "same_as_chat" means the chat model
  # rates its own answers — convenient, but it grades itself generously. Point
  # this at a different local model when you have one; absolute scores are only
  # comparable between runs that used the same judge.
  judge_model: "same_as_chat"
